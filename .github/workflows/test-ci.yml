name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./ci.db"
      NEXTAUTH_SECRET: "ci-dummy-secret-not-for-prod"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bun run db:generate

      - name: Prisma db push (SQLite, ephemeral)
        run: bun run db:push

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Tenant isolation tests
        run: bun run test:tenant

      - name: Module gate tests
        run: bun run test:gate

      - name: CSV import unit tests
        run: bun run test:csv

      - name: Cycle schema unit tests
        run: bun run test:cycles

      - name: Retrospective schema unit tests
        run: bun run test:retros

      - name: Task comment schema unit tests
        run: bun run test:comments

      - name: Milestone schema unit tests
        run: bun run test:milestones

      - name: Task dependency schema unit tests
        run: bun run test:dependencies

      - name: Task checklist schema unit tests
        run: bun run test:checklists

      - name: Task time entry schema unit tests
        run: bun run test:time-entries

      - name: Build
        run: bun run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build test
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: nexus-suite:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
